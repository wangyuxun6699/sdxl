<div class="toolbar"><label>图片 <select id="sample" aria-label="选择测试图片"></select></label><label>显示放大 <input id="zoom" type="range" min="100" max="400" step="25" value="100"><output id="zoomLabel">100%</output></label><label><input id="geometry" type="checkbox">几何改动</label><label><input id="review" type="checkbox">颜色复核</label></div>

<div class="grid">
<section class="card"><h2>原始 PNG</h2><div class="scroll"><div class="scene"><img id="original" alt="原始模型生成图片"></div></div><div class="caption">原始输入，没有重绘或模糊遮掩。</div></section>
<section class="card"><h2>v1</h2><div class="scroll"><div class="scene"><img id="v1" alt="v1 后处理结果"></div></div><div class="caption">恢复 v1 代码后重跑，已核对原图与输出哈希。</div></section>
<section class="card"><h2>v2</h2><div class="scroll"><div class="scene"><img id="v2" alt="v2 后处理结果"><img id="geometryLayer" class="overlay" alt="几何改动标记"><img id="reviewLayer" class="overlay" alt="颜色复核标记"></div></div><div class="caption"><a id="full" target="_blank" rel="noopener">全图对照</a> · <a id="detail" target="_blank" rel="noopener">局部放大</a> · <a id="cleaned" target="_blank" rel="noopener">结果 PNG</a> · <a id="report" target="_blank" rel="noopener">JSON 记录</a></div></section>
</div><div id="status" aria-live="polite"></div>
<footer>连通区域、空间色块不等于建筑实例或高度档位。复杂多色图有待复核部分；截图与测试记录不构成真实高度或几何准确率证明。详细方法、限制、测试与联网依据见 backend 目录中的说明文件。</footer>

for(const [i,s] of samples.entries()){const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.filename}`;byId('sample').append(o);}
function show(){const s=samples[Number(byId('sample').value)],p=s.filename+'/';for(const [id,file] of Object.entries({original:'original.png',v1:'v1_cleaned.png',v2:'cleaned.png',geometryLayer:'geometry_overlay.png',reviewLayer:'review_overlay.png'})){byId(id).src=p+file;}for(const [id,file] of Object.entries({full:'comparison_v1_v2.png',detail:'detail_comparison.png',cleaned:'cleaned.png',report:'report.json'})){byId(id).href=p+file;}const c=s.v2_counts;byId('status').textContent=`${s.size[0]} × ${s.size[1]} PNG · 连通区域 ${c.components_before} → ${c.components_after} · 轮廓修改 ${c.geometry_changed_px} 像素 · 颜色复核 ${c.review_px} 像素 · 单次核心处理 ${s.core_seconds.toFixed(3)} 秒`;for(const el of document.querySelectorAll('.scroll')){el.scrollLeft=0;el.scrollTop=0;}}
byId('sample').addEventListener('change',show);
byId('zoom').addEventListener('input',()=>{const size=byId('zoom').value+'%';byId('zoomLabel').textContent=size;for(const el of document.querySelectorAll('.scene'))el.style.width=size;});
for(const [id,layer] of [['geometry','geometryLayer'],['review','reviewLayer']])byId(id).addEventListener('change',()=>byId(layer).style.display=byId(id).checked?'block':'none');
let syncing=false;const panes=[...document.querySelectorAll('.scroll')];for(const pane of panes)pane.addEventListener('scroll',()=>{if(syncing)return;syncing=true;const x=pane.scrollLeft/Math.max(1,pane.scrollWidth-pane.clientWidth),y=pane.scrollTop/Math.max(1,pane.scrollHeight-pane.clientHeight);for(const other of panes)if(other!==pane){other.scrollLeft=x*(other.scrollWidth-other.clientWidth);other.scrollTop=y*(other.scrollHeight-other.clientHeight);}requestAnimationFrame(()=>syncing=false);});
show();
